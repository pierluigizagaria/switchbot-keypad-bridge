esphome:
  name: switchbot-keypad-bridge-test

esp32:
  board: wt32-eth01
  framework:
    type: esp-idf

external_components:
  - source: ../components
    components: [switchbot_keypad_bridge]

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_EXT_IN
  phy_addr: 1
  power_pin: GPIO16

logger:
  level: VERBOSE

api:
  actions:
    - action: rearm_keypad
      then:
        - switchbot_keypad_bridge.rearm: keypad_bridge
    # Also instantiate the action in an automation with typed arguments.
    - action: rearm_keypad_with_reason
      variables:
        reason: string
      then:
        - switchbot_keypad_bridge.rearm: keypad_bridge

ota:
  - platform: esphome

time:
  - platform: sntp

switchbot_keypad_bridge:
  id: keypad_bridge
  rearm_after: 20s
  keypad_action:
    name: Action
  keypad:
    name: Keypad
  linked_lock:
    name: Lock
  keypad_battery_level:
    name: Keypad battery
  lock_battery_level:
    name: Lock battery
  reset_button:
    name: Reset

# The optional button uses the same local action as the API above.
button:
  - platform: template
    name: Rearm keypad
    on_press:
      - switchbot_keypad_bridge.rearm:
          id: keypad_bridge
